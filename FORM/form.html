<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Entry Form</title>
   
</head>
<body>

    <div class="sheet">
        <h1>Student Entry Form</h1>

        <form>
            <div class="row">
                <label for="student-id">Student ID</label>
                <input id="student-id" type="text" placeholder="e.g. 2024CS001">
            </div>

            <div class="row">
                <label for="student-name">Student Name</label>
                <input id="student-name" type="text" placeholder="Full name">
            </div>

            <div class="row">
                <label for="father-name">Father's Name</label>
                <input id="father-name" type="text" placeholder="Father's full name">
            </div>

            <div class="row">
                <label for="mother-name">Mother's Name</label>
                <input id="mother-name" type="text" placeholder="Mother's full name">
            </div>

            <div class="row">
                <label for="dob">Date of Birth</label>
                <input id="dob" type="date">
            </div>
            <div class="row">
                <label>Gender</label>
                <div class="radio-group">
                    <label><input type="radio" name="gender" value="male"> Male</label>
                    <label><input type="radio" name="gender" value="female"> Female</label>
                    <label><input type="radio" name="gender" value="other"> Other</label>
                </div>
            </div>
             <div class="row">
                <label for="mobile">Mobile No.</label>
                 <input id="mobile" type="tel" placeholder="10-digit number">
            </div>
            <div class="row">
                <label for="email">Email ID</label>
                <input id="email" type="email" placeholder="you@example.com">
            </div>
            <div class="row">
                <label for="password">Password</label>
                <input id="password" type="password" placeholder="Create a strong password">
            </div>

            <div class="row">
                <label for="address">Address</label>
                <textarea id="address" placeholder="Stree t, city, state, pincode"></textarea>
            </div>

            <div class="row">
                <label for="department">Department</label>
                <select id="department">
                    <option>CSE</option>
                    <option>IT</option>
                    <option>ECE</option>
                    <option>EEE</option>
                    <option>CE</option>
                    <option>ME</option>
                </select>
            </div>

            <div class="row">
                <label for="course">Course</label>
                <select id="course">
                    <option>B.Tech</option>
                    <option>BCA</option>
                    <option>M.Tech</option>
                    <option>MCA</option>
                </select>
            </div>

            <div class="row">
                <label for="semester">Semester</label>
                <select id="semester">
                    <option>1</option>
                    <option>2</option>
                    <option>3</option>
                    <option>4</option>
                    <option>5</option>
                    <option>6</option>
                    <option>7</option>
                    <option>8</option>
                </select>
            </div>

            <div class="row">
                <label>Hobbies</label>
                <div class="check-group">
                    <label><input type="checkbox"> Reading</label>
                    <label><input type="checkbox"> Sports</label>
                    <label><input type="checkbox"> Music</label>
                </div>
            </div>

            <div class="row file-row">
                <label for="photo">Upload Photo</label>
                <input id="photo" type="file">
            </div>

            <div class="actions">
                <button type="submit">Submit</button>
                <button type="reset">Reset</button>
            </div>
        </form>
    </div>

</body>
</html>
